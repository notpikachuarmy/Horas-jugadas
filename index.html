<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MIS HORAS JUGADAS</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="dot"></span><span>MIS HORAS JUGADAS</span></div>
  <div class="subtitle">Catálogo y estadísticas de tiempo jugado</div>
</header>

<main class="wrap">
  <section class="page-top">
    <div>
      <p class="eyebrow">CATÁLOGO</p>
      <h1>Mis horas jugadas</h1>
      <p class="intro">La sección de Gameplays recreada para medir <strong>horas jugadas</strong> en lugar de número de directos.</p>
    </div>
  </section>

  <div class="catalog-tabs">
    <button class="catalog-btn active" data-tab="juegos">Juegos</button>
    <button class="catalog-btn" data-tab="series">Series</button>
    <button class="catalog-btn" data-tab="estadisticas">Estadísticas</button>
  </div>

  <div class="catalog-tools">
    <input id="search" type="search" placeholder="Buscar juego o serie..." autocomplete="off">
    <label><span>Ordenar por</span>
      <select id="sort">
        <option value="most">Más horas jugadas</option>
        <option value="least">Menos horas jugadas</option>
        <option value="recent">Última sesión más reciente</option>
        <option value="oldest">Última sesión más antigua</option>
        <option value="az">Nombre A-Z</option>
        <option value="za">Nombre Z-A</option>
      </select>
    </label>
  </div>

  <section id="tab-juegos" class="tab-page active"><div id="gamesList" class="games-grid"></div></section>
  <section id="tab-series" class="tab-page"><div id="seriesList" class="series-grid"></div></section>
  <section id="tab-estadisticas" class="tab-page"><div id="statsContent"></div></section>
  <section id="detail" class="tab-page"></section>
</main>

<footer>Los datos se cargan directamente desde los CSV publicados de Google Sheets.</footer>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="app.js"></script>
</body>
</html>
